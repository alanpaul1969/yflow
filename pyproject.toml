[build-system]
requires = ["setuptools>=68,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yflow"
version = "0.1.0"
description = "The Makefile for AI workflows — 1 dependency, zero daemons, provider-agnostic"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Guo-luen Huang", email = "yflow@maintainers.local"},
]
keywords = [
    "workflow",
    "ai",
    "agent",
    "orchestrator",
    "yaml",
    "automation",
    "llm",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/alanpaul1969/yflow"
Repository = "https://github.com/alanpaul1969/yflow.git"
Issues = "https://github.com/alanpaul1969/yflow/issues"

[project.scripts]
yamlflow = "yamlflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
